plugins {
    id 'com.android.application'
}

android {
    namespace 'com.trashgames.trashsoccer.android'

    compileSdk 36

    signingConfigs {
        release {
            storeFile file('trashsoccer.keystore')
            storePassword 'trashsoccer'
            keyAlias 'trashsoccer'
            keyPassword 'trashsoccer'
        }
    }

    defaultConfig {
        applicationId 'com.trashgames.trashsoccer.android'
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs    = ['res']
            assets.srcDirs = ['assets']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

// Separate configuration holding the per-ABI native libraries (extracted below so AGP
// packages them into the APK; AGP does not pick up .so files from plain jars).
configurations {
    natives
}

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"

    // Bundle the per-ABI native libraries (incl. 64-bit arm64-v8a, required on Android 16).
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
}

// Unpack the gdx/gdx-box2d native .so files from the natives jars into src/main/jniLibs/<abi>,
// which is where the Android Gradle Plugin expects JNI libraries.
def jniLibsDir = file('src/main/jniLibs')
tasks.register('copyAndroidNatives') {
    doLast {
        jniLibsDir.mkdirs()
        configurations.natives.files.each { jar ->
            def abi = null
            if (jar.name.contains('natives-armeabi-v7a')) abi = 'armeabi-v7a'
            else if (jar.name.contains('natives-arm64-v8a')) abi = 'arm64-v8a'
            else if (jar.name.contains('natives-x86_64')) abi = 'x86_64'
            else if (jar.name.contains('natives-x86')) abi = 'x86'
            if (abi != null) {
                copy {
                    from zipTree(jar)
                    into file("$jniLibsDir/$abi")
                    include '*.so'
                }
            }
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'copyAndroidNatives'
}